# Single `reclass` APP package — a faithful Rust + GPUI port of Reclass
# (github.com/IChooseYou/Reclass, MIT). The C++ app links everything into one
# executable and its `src/` is cleanly layered, so the port mirrors that layering
# as modules inside one package (see ARCHITECTURE.md §2 — the subsystem crates of
# the diagram become the top-level `src/` modules).
#
# DOCUMENTED DEVIATION (was "NOT a Cargo workspace"): a minimal `[workspace]` now
# exists below, but ONLY to build the separately-distributed plugin SDK
# (`crates/reclass-plugin-abi` + `crates/reclass-plugin`) and the example native
# plugins (`examples/plugins/*`) that design §6 Phase 3 requires as standalone
# cdylibs. The APP is still ONE package (`reclass`); host-side dynamic loading is
# feature-gated, while platform-specific pieces inside it are target-cfg gated.
#
# Portable headless logic builds with `--no-default-features`; the GPUI UI is
# isolated behind the default `ui` feature (the only thing that pulls gpui).

# ── Workspace (design §6 Phase 3 SDK + examples only; see the note above). ──
[workspace]
resolver = "2"
members = [
    "crates/reclass-plugin-abi",
    "crates/reclass-plugin",
    "crates/rcx-rpc",
    "crates/rcx-payload",
    "examples/plugins/example-provider",
    "examples/plugins/example-ui",
    # Phase 4: a test ReClass.NET native plugin (raw extern-C CoreFunctions).
    "examples/plugins/reclassnet-fake-native",
]

[package]
name = "reclass"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A structured-data / struct-layout editor — Rust + GPUI port of Reclass."
repository = "https://github.com/IChooseYou/Reclass"
default-run = "reclass"

# ── The app binary (src/main.cpp). Re-exported default feature set incl. ui. ──
[[bin]]
name = "reclass"
path = "src/main.rs"

# ── stdio <-> local-socket MCP shim (tools/rcx-mcp-stdio.cpp). Standalone. ──
[[bin]]
name = "reclass-mcp-bridge"
path = "src/bin/reclass-mcp-bridge.rs"
required-features = ["mcp"]

[lib]
name = "reclass"
path = "src/lib.rs"

[[bench]]
name = "perf_workloads"
harness = false

# ─────────────────────────────────────────────────────────────────────────────
# Features (ARCHITECTURE.md §8). Off `ui` ⇒ headless engine build (logic-only).
# ─────────────────────────────────────────────────────────────────────────────
[features]
default = [
    "ui",
    "imports",
    "disasm",
    "symbols",
    "mcp",
    "native-providers",
    "memflow-provider",
    "scanflow-provider",
    "plugins",
]

# The whole GPUI UI surface. The ONLY feature that pulls gpui/gpui-component.
# `gpui-component-assets` is part of it: it bundles the SVG icon assets that back
# `gpui_component::IconName`, registered via `application().with_assets(...)` in
# main.rs — without it `IconName` variants render as empty boxes (no SVG source).
ui = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:gpui-component-assets"]

# Source / ReClass-XML import+export, PDB import, and PE-debug extraction.
# pdb2/object are pure Rust ⇒ build on all OSes.
imports = ["dep:quick-xml", "dep:regex", "dep:zerocopy", "dep:object", "dep:pdb2", "dep:zip"]

# x86/x64 disassembly + hex dump (replaces fadec). Pure Rust.
disasm = ["dep:iced-x86"]

# RTTI walkers / demanglers / name providers + MS symbol-server download.
symbols = ["dep:cpp_demangle", "dep:msvc-demangler", "dep:regex", "dep:reqwest"]

# JSON-RPC 2.0 MCP server over a local socket.
mcp = ["dep:interprocess"]

# Live-process provider through memflow's runtime connector/OS plugin inventory.
memflow-provider = ["dep:memflow"]

# memflow-native advanced scan helpers. The generic pointer-map/chain scanner
# works over any Provider; this enables the scanflow-backed backend only for
# MemflowProvider targets.
scanflow-provider = ["memflow-provider", "dep:scanflow"]

# C++ provider parity set. Individual providers stay feature-addressable for
# lean builds; platform-specific implementations are target-cfg gated inside the
# modules.
native-providers = [
    "process-provider",
    "kernel-provider",
    "remote-process-provider",
    "windbg-provider",
]
process-provider = ["dep:procfs", "dep:nix", "dep:windows-sys"]
kernel-provider = ["dep:windows-sys"]
remote-process-provider = [
    "dep:rcx-rpc",
    "dep:rcx-payload",
    "dep:procfs",
    "dep:nix",
    "dep:libc",
    "dep:windows-sys",
]
windbg-provider = ["dep:windows", "dep:windows-sys"]

# Legacy native-provider loader seam.
native-plugins = ["dep:libloading"]

# Stable-ABI native plugin loader + ReClass.NET native/managed compatibility
# routing. The managed CLR host is additionally target-gated to Windows below.
plugins = ["dep:abi_stable", "dep:libloading", "dep:reclass-plugin-abi", "dep:windows"]

# Optional parallel scanner (rayon). Off by default: the scanner falls back to
# a serial scan so `--no-default-features` stays lean. (ARCHITECTURE.md §3.)
scanner-parallel = ["dep:rayon"]

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies. Versions per _design/crate_selection.md (verified 2026-05-31).
# ─────────────────────────────────────────────────────────────────────────────
[dependencies]
# core model + serde (.rcx) — always on.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plugin `plugin.toml` manifest parsing (design §5, §6 Phase 6). Pure-Rust and
# already a transitive dep (the version pinned in Cargo.lock), so keeping it as
# a direct always-on host-bookkeeping edge leaves lean builds effectively unaffected;
# it is NOT gated behind the `plugins` feature because manifest parsing is host
# bookkeeping that has no `abi_stable`/`libloading` ties.
toml = "0.8"
ahash = "0.8"
# Live process readability checks are a read-mostly range-cache workload. This
# crate is already present transitively through the UI stack; using it directly
# avoids taking an `RwLock` on every hot `Provider::is_readable` query while
# keeping region refreshes as explicit atomic cache replacement.
arc-swap = "1"
# `CachedPageProvider` is hit once per visible live row during compose/refresh.
# Its page map is short-lived and uncontended, so `parking_lot::Mutex` removes
# std mutex poisoning overhead on the live-provider hot path.
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
half = "2"
# Scanner exact byte-pattern search. `memchr` is a small, mature crate already
# present transitively; making it direct lets the scanner use its optimized
# `memmem::Finder` instead of the local BMH loop for unmasked alignment-1 scans.
memchr = "2"
# Type inference produces a tiny candidate set per previewed value; `SmallVec`
# keeps that hot-loop scratch storage inline while reusing a mature crate already
# present transitively through the UI stack.
smallvec = "1"

# CLI + logging for the bin.
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File data source (memmap2) — built-in benign provider.
memmap2 = "0.9"

# Config / cache dirs (QStandardPaths). Always-on: the theme manager resolves
# the user theme dir (AppDataLocation); `symbols` additionally uses it for the
# SymbolCache. Pure Rust, tiny — no reason to feature-gate.
directories = "6"

# Live-process provider. This links only memflow core; connectors/OS layers such
# as qemu, kvm, pcileech, winio, and win32 are discovered at runtime from memflow
# plugin directories. Default-on via `memflow-provider`, removable in lean builds.
memflow = { version = "0.2.4", optional = true }
# memflow-native pointer-map / global / sigmaker primitives. Only compiled when
# `scanflow-provider` is enabled; UI calls stay capability-gated to memflow.
scanflow = { version = "0.2.1", optional = true }
rcx-rpc = { path = "crates/rcx-rpc", optional = true }
rcx-payload = { path = "crates/rcx-payload", optional = true }

# ── feature-gated product-mode dependencies ──
# disasm — pure Rust x86/x64 decoder+formatter (replaces fadec).
iced-x86 = { version = "1", optional = true }
# scanner — optional parallel value/pattern search (QtConcurrent → rayon).
rayon = { version = "1", optional = true }
quick-xml = { version = "0.40", optional = true }
regex = { version = "1", optional = true }
zerocopy = { version = "0.8", optional = true, features = ["derive"] }
object = { version = "0.39", optional = true }
pdb2 = { version = "0.10", optional = true }
# ReClass.NET `.rcnet` = a ZIP (standard DEFLATE) wrapping Data.xml — `deflate` only.
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
cpp_demangle = { version = "0.5", optional = true }
msvc-demangler = { version = "0.11", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
interprocess = { version = "2", optional = true }
libloading = { version = "0.9", optional = true }

# ── plugins (Phase 3 stable-ABI native loader) — host side ──
# The stable ABI + load-time version/layout check (design §7.B [+]).
abi_stable = { version = "0.11", optional = true }
# The shared FFI contract crate (the single definition host + plugin agree on).
reclass-plugin-abi = { path = "crates/reclass-plugin-abi", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux local-process provider: procfs handles stat/exe metadata, while nix
# exposes process_vm_readv/writev for the C++ fast path before /proc/pid/mem
# fallback.
procfs = { version = "0.18", optional = true, default-features = false }
nix = { version = "0.31", optional = true, default-features = false, features = ["process", "ptrace", "signal", "uio"] }
libc = { version = "0.2", optional = true }

# ── plugins (Phase 5 ReClass.NET managed CLR host) — Windows-only ──
# The official `windows` crate CLR-hosting COM bindings host the .NET Framework 4.x
# CLR for the managed ReClass.NET compat path (design §4 managed path, §6 Phase 5,
# §8 decision). Target-gated to Windows and pulled only by `plugins`, so Linux
# builds do not compile this edge. The three features carry exactly the API the
# CLR host uses (verified against windows 0.62):
#   Win32_System_ClrHosting → CLRCreateInstance, CLSID_CLRMetaHost, ICLRMetaHost,
#                             ICLRRuntimeInfo, ICLRRuntimeHost (Start/
#                             ExecuteInDefaultAppDomain)
#   Win32_System_Com        → COM scaffolding the ClrHosting types build on
#   Win32_Foundation        → HRESULT / BOOL / handle primitives
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ClrHosting",
    "Win32_System_Diagnostics_Debug_Extensions",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
] }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
criterion = "0.8.2"

# ── UI (gpui) — unpinned git, SAME source form as gpui-component (§7). ──
# Do NOT add `rev=` to gpui/gpui_platform; reproducibility = committed Cargo.lock.
[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
optional = true

[dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]
optional = true

[dependencies.gpui-component]
git = "https://github.com/longbridge/gpui-component"
rev = "bd4174e4991eef4c0900cb6dfb7143e0889f5dd9"
optional = true

# The SVG icon asset bundle for gpui-component (crate `gpui_component_assets`,
# same git repo + rev as gpui-component). Registered via
# `application().with_assets(gpui_component_assets::Assets)` so `IconName`
# variants resolve to real SVGs. ui-gated so `--no-default-features` stays clean.
[dependencies.gpui-component-assets]
git = "https://github.com/longbridge/gpui-component"
rev = "bd4174e4991eef4c0900cb6dfb7143e0889f5dd9"
optional = true
