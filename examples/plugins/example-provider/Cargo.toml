# example-provider — a minimal native provider plugin (design §6 Phase 3, §G
# "example plugins (provider, …)"). Built as a cdylib that exports the abi_stable
# root module via `reclass_plugin::export_plugin!`. The host loads this `.so` and
# registers its provider through the SAME PluginManager path as an in-tree built-in
# (the §1 parity table satisfied by a real loaded library).
[package]
name = "example-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Example native Reclass provider plugin."
publish = false

[lib]
# A native dynamic library the host dlopen's. `dylib` (not just cdylib) keeps the
# Rust-side abi_stable layout symbols available for the version/layout check.
crate-type = ["cdylib"]

[dependencies]
reclass-plugin = { path = "../../../crates/reclass-plugin" }
# `#[export_root_module]` (applied by `export_plugin!`) generates `::abi_stable::…`
# paths, so a plugin crate must have `abi_stable` as a direct dependency (the
# idiomatic abi_stable plugin requirement). Same major/minor as the SDK.
abi_stable = "0.11"
